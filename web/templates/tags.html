{{template "base" .}}
{{define "content"}}
<div class="page-header">
    <h1 class="page-title">Tags</h1>
</div>
{{if .Tags}}
<div class="tag-cloud">
    {{range .Tags}}
    <a href="/tags/{{.Name}}" class="tag">{{.Name}}</a>
    {{end}}
</div>
{{else}}
<p class="muted">No tags yet.</p>
{{end}}
{{end}}
