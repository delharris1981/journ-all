{{template "base" .}}
{{define "content"}}
<div class="auth-page">
    <h1 class="auth-title">Sign up</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    {{if .SignupsEnabled}}
    <form method="post" action="/signup" class="auth-form">
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm">Confirm password</label>
            <input class="form-input" type="password" id="confirm" name="confirm" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign up</button>
    </form>
    {{else}}
    <p class="muted">Signups are currently disabled. Contact an admin for an account.</p>
    {{end}}
    <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</div>
{{end}}
