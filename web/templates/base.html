<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — Journ-all</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        // Set the theme before first paint to avoid a flash of the wrong one.
        (function () {
            var t = localStorage.getItem('theme');
            if (t !== 'dark' && t !== 'light') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = t;
        })();
    </script>
</head>
<body>
    {{if .User}}
    <nav class="nav">
        <a href="/" class="wordmark">Journ-all</a>
        <div class="nav-links">
            <a href="/entries">Entries</a>
            <a href="/calendar">Calendar</a>
            <a href="/tags">Tags</a>
            <a href="/export">Export</a>
            <form method="post" action="/logout" class="inline">
                <button type="submit" class="link">Log out</button>
            </form>
            <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle light/dark theme">Theme</button>
        </div>
    </nav>
    {{else}}
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-floating" title="Toggle light/dark theme">Theme</button>
    {{end}}
    <main class="content">
        {{template "content" .}}
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
