{{template "base" .}}
{{define "content"}}
<div class="page-header">
    <h1 class="page-title">{{if .Entry}}Edit{{else}}New{{end}} entry</h1>
</div>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="{{if .Entry}}/entries/{{.Entry.ID}}{{else}}/entries{{end}}" class="entry-form">
    <div class="form-group">
        <label class="form-label" for="title">Title</label>
        <input class="form-input" type="text" id="title" name="title" value="{{if .Entry}}{{.Entry.Title}}{{end}}" autofocus>
    </div>
    <div class="form-group">
        <label class="form-label" for="body">Body</label>
        <div class="editor">
            <div class="editor-pane">
                <div class="toolbar" data-for="editor">
                    <button type="button" class="tb" data-md="h1" title="Heading 1">H1</button>
                    <button type="button" class="tb" data-md="h2" title="Heading 2">H2</button>
                    <button type="button" class="tb" data-md="h3" title="Heading 3">H3</button>
                    <span class="tb-sep"></span>
                    <button type="button" class="tb" data-md="bold" title="Bold"><b>B</b></button>
                    <button type="button" class="tb" data-md="italic" title="Italic"><i>I</i></button>
                    <button type="button" class="tb" data-md="code" title="Inline code">&lt;&gt;</button>
                    <span class="tb-sep"></span>
                    <button type="button" class="tb" data-md="ul" title="Bullet list">&bull;</button>
                    <button type="button" class="tb" data-md="ol" title="Numbered list">1.</button>
                    <button type="button" class="tb" data-md="quote" title="Quote">&rdquo;</button>
                    <span class="tb-sep"></span>
                    <button type="button" class="tb" data-md="link" title="Link">&#128279;</button>
                    <button type="button" class="tb" data-md="hr" title="Divider">&mdash;</button>
                </div>
                <textarea id="editor" name="body" class="editor-textarea" placeholder="Write..."
                    hx-post="/preview" hx-trigger="input delay:300ms" hx-target="#preview" hx-swap="innerHTML">{{if .Entry}}{{.Entry.Body}}{{end}}</textarea>
            </div>
            <div class="editor-pane">
                <div id="preview" class="preview-pane markdown"></div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="form-label" for="tags">Tags</label>
        <input class="form-input" type="text" id="tags" name="tags" value="{{if .Entry}}{{range .Tags}}{{.Name}}, {{end}}{{end}}" placeholder="comma, separated, tags">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{if .Entry}}/entries/{{.Entry.ID}}{{else}}/entries{{end}}" class="btn">Cancel</a>
    </div>
</form>
{{end}}
