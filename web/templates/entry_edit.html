{{template "base" .}}
{{define "content"}}
<div class="page-header">
    <h1 class="page-title">{{if .Entry}}Edit{{else}}New{{end}} entry</h1>
</div>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="{{if .Entry}}/entries/{{.Entry.ID}}{{else}}/entries{{end}}" class="entry-form">
    <div class="form-group">
        <label class="form-label" for="title">Title</label>
        <input class="form-input" type="text" id="title" name="title" value="{{if .Entry}}{{.Entry.Title}}{{end}}" autofocus>
    </div>
    <div class="form-group">
        <label class="form-label" for="body">Body</label>
        <div class="toolbar" data-for="editor"></div>
        <div id="editor" class="editor-surface markdown" contenteditable="true" data-placeholder="Write..."></div>
        <textarea id="body-src" name="body" hidden>{{if .Entry}}{{.Entry.Body}}{{end}}</textarea>
    </div>
    <div class="form-group">
        <label class="form-label" for="tags">Tags</label>
        <input class="form-input" type="text" id="tags" name="tags" value="{{if .Entry}}{{range .Tags}}{{.Name}}, {{end}}{{end}}" placeholder="comma, separated, tags">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{if .Entry}}/entries/{{.Entry.ID}}{{else}}/entries{{end}}" class="btn">Cancel</a>
    </div>
</form>
{{end}}
